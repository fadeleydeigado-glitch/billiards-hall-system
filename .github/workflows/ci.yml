name: CI

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    name: Python and frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend
        run: python -m compileall backend

      - name: Run Python unit tests
        run: python -m unittest tests.test_decimal_money

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend tests
        run: node --test frontend/tests/frontend.test.mjs
