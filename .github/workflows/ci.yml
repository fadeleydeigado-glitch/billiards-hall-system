name: CI

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    name: Python and frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile backend
        run: python -m compileall backend

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python unit tests
        run: python -m unittest tests.test_api_errors tests.test_request_schemas tests.test_id_utils tests.test_decimal_money tests.test_product_backup tests.test_table_exists_check tests.test_idempotency tests.test_open_table_unsettled tests.test_local_cache tests.test_flash_sale_queue

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run frontend tests
        run: node --test frontend/tests/frontend.test.mjs
